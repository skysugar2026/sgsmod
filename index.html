<title>末日三国终章 · 10000 武将</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b0e14;color:#e6e9ef;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:32px 20px}
  .wrap{max-width:520px;width:100%;text-align:center}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:.04em;

  .stat{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
  .stat div{background:#151a24;border:1px solid #222a38;border-radius:10px;padding:10px 16px;min-width:96px}

  .stat span{font-size:12px;color:#8b93a7}
  a.btn{display:block;padding:15px 20px;border-radius:12px;text-decoration:none;font-size:16px;font-weight:600;
        background:linear-gradient(92deg,#c084fc,#4a7fe0);color:#fff;margin-bottom:12px;
        transition:transform .15s,filter .15s}
  a.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  a.alt{background:#151a24;border:1px solid #222a38;color:#c7cede}
  .note{margin-top:22px;font-size:12px;color:#6b7385;line-height:1.7}
